<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Doğrulama Görseli</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { font-size: 20px; margin-bottom: 20px; color: #4fc3f7; }
.stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat { background: #16213e; border-radius: 8px; padding: 12px 18px; border: 1px solid #2a2a4a; }
.stat .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.stat .value { font-size: 22px; font-weight: bold; margin-top: 4px; }
.stat .value.pass { color: #4caf50; }
.stat .value.fail { color: #f44336; }
.grid-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 11px; }
th { padding: 6px 4px; background: #16213e; color: #90caf9; position: sticky; top: 0; font-weight: 600; white-space: nowrap; }
th.row-label { min-width: 40px; }
td { padding: 3px; text-align: center; border: 1px solid #2a2a4a; min-width: 52px; height: 52px; }
.cell-box { width: 48px; height: 48px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; line-height: 1.2; position: relative; border: 1.5px solid rgba(255,255,255,0.08); }
.cell-box .top { font-weight: bold; font-size: 12px; }
.cell-box .under { font-size: 9px; opacity: 0.7; }
.cell-box .dir-badge { position: absolute; top: -6px; right: -6px; font-size: 7px; padding: 1px 4px; border-radius: 4px; }
.cw { background: rgba(76,175,80,0.2); }
.ccw { background: rgba(255,152,0,0.2); }
.siyah { background: #222; color: #e0e0e0; }
.kirmizi { background: #8b1a1a; color: #ffcdd2; }
.mavi { background: #1a3a5c; color: #bbdefb; }
.beyaz { background: #3a3a4a; color: #e0e0e0; }
.dir-cw { background: rgba(76,175,80,0.4); color: #a5d6a7; }
.dir-ccw { background: rgba(255,152,0,0.4); color: #ffe0b2; }
.legend { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.color-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15); }
.coords { position: absolute; bottom: -6px; left: -6px; font-size: 7px; opacity: 0.4; }
</style>
</head>
<body>
<h1>🧵 Braid Matrix Doğrulama</h1>
<div class="stats" id="stats"></div>
<div class="legend" id="legend"></div>
<div class="grid-wrap" id="grid"></div>
<script>
fetch('/debug-matrix-surface.json')
  .then(r => r.json())
  .then(data => {
    const { meta, cells } = data;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="label">Toplam Hücre</div><div class="value">${meta.totalCells}</div></div>
      <div class="stat"><div class="label">underCarrier=null</div><div class="value ${meta.nullUnderCount === 0 ? 'pass' : 'fail'}">${meta.nullUnderCount} (${meta.nullUnderRatio})</div></div>
      <div class="stat"><div class="label">Direction Uyumsuz</div><div class="value ${meta.directionMismatchCount === 0 ? 'pass' : 'fail'}">${meta.directionMismatchCount} (${meta.directionMismatchRatio})</div></div>
      <div class="stat"><div class="label">Durum</div><div class="value ${meta.status === 'PASS' ? 'pass' : 'fail'}">${meta.status}</div></div>
    `;

    const cols = 16;
    const grid = document.getElementById('grid');
    let html = '<table><tr><th class="row-label">t\\c</th>';
    for (let c = 0; c < cols; c++) html += `<th>${c}</th>`;
    html += '</tr>';

    for (let r = 0; r < 12; r++) {
      html += `<tr><th>${r}</th>`;
      for (let c = 0; c < cols; c++) {
        const e = cells[r * cols + c];
        if (!e || !e.topCarrier) { html += '<td>-</td>'; continue; }
        const topColor = e.topCarrier.color || 'beyaz';
        const underColor = e.underCarrier ? (e.underCarrier.color || 'beyaz') : '';
        const dir = e.topDirection === 'clockwise' ? 'cw' : 'ccw';
        html += `<td>
          <div class="cell-box ${dir}" style="border-left: 3px solid ${topColor === 'siyah' ? '#666' : topColor === 'kirmizi' ? '#ef5350' : topColor === 'mavi' ? '#42a5f5' : '#888'}">
            <span class="top">#${e.topCarrier.no}</span>
            <span class="under">#${e.underCarrier ? e.underCarrier.no : '-'}</span>
            <span class="dir-badge dir-${dir}">${e.topDirection === 'clockwise' ? '↻' : '↺'}</span>
            <span class="coords">${r},${c}</span>
          </div>
        </td>`;
      }
      html += '</tr>';
    }
    html += '</table>';
    grid.innerHTML = html;
  });
</script>
</body>
</html>
