name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - codex/physical-preview-v1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Tests
        run: npm test
